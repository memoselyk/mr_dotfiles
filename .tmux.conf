# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Trying for session management
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @plugin 'dracula/tmux'
# Dracula configuration
set -g @dracula-show-powerline true
set -g @dracula-show-flags true
set -g @dracula-show-left-icon \uf17c    # Tux icon on left
set -g @dracula-border-contrast true

set -g @dracula-plugins "custom:vmip.sh cpu-usage ram-usage time"
set -g @dracula-cpu-usage-colors "green dark_gray"
set -g @dracula-ram-usage-colors "yellow dark_gray"
set -g @dracula-custom-plugin-colors "white dark_purple"

# -- Dracula wheather
set -g @dracula-show-fahrenheit false

# Set 256 colors
set -s default-terminal 'tmux-256color'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
